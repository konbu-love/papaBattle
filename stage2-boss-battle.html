<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彼女の家から脱出 - お父さんボス戦</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@700;900&display=swap');

  :root{
    --navy: #16204A;
    --navy2: #23306B;
    --gold: #E8C15A;
    --gold-dim: #B99A46;
    --paper: #F4EFE0;
    --red: #C64545;
    --blue-hl: #4F8FE8;
    --good: #4CAF6D;
    --tatami: #5E7A3D;
    --floor: #A9784F;
    --danger: rgba(198,69,69,0.55);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'DotGothic16', 'M PLUS Rounded 1c', sans-serif;
    color: var(--paper);
    background:
      radial-gradient(circle at 80% 0%, #3A4A9C 0%, transparent 45%),
      linear-gradient(180deg, #0C1230 0%, #16204A 55%, #0C1230 100%);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #app{ width:min(96vw, 560px); text-align:center; }

  h1{
    font-size: clamp(15px, 4.6vw, 20px);
    margin: 4px 0 2px;
    color: var(--gold);
    letter-spacing: 1.5px;
    text-shadow: 2px 2px 0 #000;
  }
  .sub{ font-size: 10px; color: #cfd6f5; margin-bottom: 10px; letter-spacing: 1px; }

  .panel{
    background: linear-gradient(180deg, var(--navy2), var(--navy));
    border-radius: 6px;
    padding: 12px;
    border: 3px solid var(--gold);
    box-shadow: 0 0 0 2px #0C1230 inset, 0 12px 26px rgba(0,0,0,0.5);
    position: relative;
    min-height: 460px;
  }

  .hud{
    display:flex; justify-content:space-between; align-items:center; gap:6px;
    margin-bottom: 8px; font-size: 11px; flex-wrap: wrap;
  }
  .hud-box{
    background: var(--navy); border: 2px solid var(--gold-dim); border-radius: 4px;
    padding: 4px 8px; letter-spacing: 1px; white-space: nowrap;
  }
  .hud .turns{ border-color: var(--gold); color: var(--gold); font-weight: 700; }
  .hud .turns.low{ color:#FF8A8A; border-color:#FF8A8A; animation: pulse 0.6s infinite alternate; }
  .hud .fatigue{ border-color: var(--red); color:#FF8A8A; display:none; font-weight:700; }
  .hud .fatigue.active{ display:inline-block; }
  @keyframes pulse{ from{opacity:1;} to{opacity:0.5;} }

  .board{
    display:grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 2px;
    aspect-ratio: 1/1;
    margin-bottom: 8px;
    background: #0C1230;
    padding: 3px;
    border: 2px solid var(--gold-dim);
    border-radius: 4px;
  }
  .cell{
    position: relative;
    display:flex; align-items:center; justify-content:center;
    font-size: clamp(11px, 3.4vw, 16px);
    border: 1px solid rgba(0,0,0,0.25);
  }
  .cell.terrain-tatami{ background: var(--tatami); }
  .cell.terrain-flooring{ background: var(--floor); }
  .cell.movable{ cursor:pointer; box-shadow: 0 0 0 2px var(--blue-hl) inset; filter: brightness(1.15); }
  .cell.movable:active{ filter: brightness(1.4); }
  .cell.danger::before{
    content:""; position:absolute; inset:0; background: var(--danger); pointer-events:none;
  }
  .cell .tag{
    position:absolute; bottom:0; font-size:4.6px; color:#fff;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.6); letter-spacing:0.2px; white-space:nowrap;
  }
  .cell .alert{
    position:absolute; top:-2px; right:-2px; font-size:9px;
  }

  .legend{
    display:flex; gap:6px; justify-content:center; flex-wrap:wrap;
    font-size: 8px; color:#aab4e0; margin-bottom: 8px;
  }
  .legend .sw{ display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:2px; vertical-align:middle; }

  .msg{
    min-height: 34px; font-size: 10.5px; color: var(--paper);
    background: var(--navy); border: 1px solid var(--gold-dim); border-radius: 4px;
    padding: 6px 8px; margin-bottom: 8px; text-align:left; line-height:1.5;
  }

  button{
    font-family: inherit; font-weight: 700; border: 2px solid var(--gold-dim);
    border-radius: 4px; padding: 8px 12px; font-size: 11px; cursor: pointer;
    background: var(--navy2); color: var(--paper); letter-spacing: 1px;
  }
  button:active{ filter: brightness(1.2); }
  button.primary{ background: var(--red); border-color:#7a1f1f; color:#fff; }
  button.good{ background: var(--good); border-color:#2c6b42; color:#fff; }
  .footer-row{ display:flex; gap:8px; justify-content:center; }

  .overlay{
    position:absolute; inset:0; background: rgba(6,10,28,0.97);
    border-radius: 6px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 16px; animation: fadein 0.15s ease-out; text-align:center;
  }
  @keyframes fadein{ from{opacity:0;} to{opacity:1;} }
  .overlay .big{ font-size: 34px; margin-bottom: 4px; }
  .overlay h2{ color: var(--gold); font-size: 17px; margin: 2px 0 8px; letter-spacing:2px; }
  .overlay p{ font-size: 10.5px; line-height:1.8; margin: 0 0 12px; color:#e3e7f7; }
  .overlay .quiet{ color:#9aa4cf; font-size:11px; letter-spacing:2px; }
  .title-badge{
    display:inline-block; background: var(--navy); border:1px solid var(--gold);
    color: var(--gold); font-size:11px; padding:6px 12px; border-radius:4px; margin: 6px 0 12px;
  }
  .btnrow{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:4px; }

  /* ボス戦演出 */
  .boss-overlay{
    position:absolute; inset:0; border-radius: 6px; overflow:hidden;
    background-size: cover; background-position: center 20%;
    display:flex; flex-direction:column; justify-content:space-between;
    animation: fadein 0.2s ease-out;
  }
  .boss-overlay.shake{ animation: shake 0.35s; }
  @keyframes shake{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-6px,3px); }
    40%{ transform:translate(6px,-3px); }
    60%{ transform:translate(-5px,-4px); }
    80%{ transform:translate(5px,4px); }
  }
  .boss-flash{
    position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;
  }
  .boss-flash.on{ opacity:0.85; transition:none; }
  .boss-flash.off{ opacity:0; transition: opacity 0.4s; }

  .boss-hp-area{ padding:10px 10px 0; }
  .boss-title{
    text-align:center; color:#fff; font-size:18px; letter-spacing:3px;
    text-shadow: 0 0 8px #000, 0 0 16px #C64545; margin-bottom:8px;
  }
  .hp-row{ display:flex; align-items:center; gap:6px; margin-bottom:5px; }
  .hp-name{ font-size:10px; color:#fff; text-shadow:1px 1px 2px #000; width:56px; flex-shrink:0; }
  .hp-bar-outer{
    flex:1; height:9px; background:rgba(0,0,0,0.6); border:1px solid #fff; border-radius:3px; overflow:hidden;
  }
  .hp-bar-inner{ height:100%; background:linear-gradient(90deg,#e84545,#ff8a8a); transition: width 0.5s ease; }
  .hp-bar-inner.taro{ background:linear-gradient(90deg,#4CAF6D,#8adf9f); }
  .hp-num{ font-size:8px; color:#fff; text-shadow:1px 1px 2px #000; width:64px; flex-shrink:0; text-align:right; }

  .boss-textbox{
    margin: 0 8px 10px; background:#0a0a0a; border:3px solid #fff; border-radius:4px;
    padding:12px 12px; min-height:56px; box-shadow: 0 0 0 2px #000;
  }
  .boss-textbox p{ color:#fff; font-size:12px; line-height:1.8; margin:0; text-shadow:1px 1px 0 #000; }
  .boss-menu{ display:flex; gap:10px; justify-content:center; font-size:10px; color:#fff; opacity:0.9; }
  .boss-continue{
    display:flex; justify-content:center; margin-top:6px;
  }
</style>
</head>
<body>
<div id="app">
  <h1>彼女の家から脱出 - お父さんボス戦</h1>
  <div class="sub">8×8 MAP / TURN LIMIT 15 / 本物の扉はランダム</div>

  <div class="panel">
    <div class="hud">
      <div class="hud-box turns" id="turnsDisplay">残り - T</div>
      <div class="hud-box fatigue" id="fatigueBadge">💫 見つかりやすい</div>
      <div class="hud-box" id="encounterBadge">遭遇: なし</div>
    </div>

    <div class="board" id="board"></div>

    <div class="legend">
      <div><span class="sw" style="background:var(--tatami);"></span>畳</div>
      <div><span class="sw" style="background:var(--floor);"></span>フローリング</div>
      <div><span class="sw" style="background:var(--danger);"></span>危険範囲</div>
      <div>❗＝追跡モード</div>
    </div>

    <div class="msg" id="msg">隣接マスをタップして移動。4つの扉のうち本物は1つだけ。</div>
    <div class="footer-row">
      <button onclick="initGame()">🔄 最初からやり直す</button>
    </div>

    <div class="overlay" id="overlay" style="display:none;"></div>
    <div class="boss-overlay" id="bossOverlay" style="display:none;">
      <div class="boss-flash" id="bossFlash"></div>
      <div class="boss-hp-area">
        <div class="boss-title">BOSS BATTLE</div>
        <div class="hp-row">
          <div class="hp-name">お父さん</div>
          <div class="hp-bar-outer"><div class="hp-bar-inner" id="fatherHpBar" style="width:100%;"></div></div>
          <div class="hp-num" id="fatherHpNum">9999999/9999999</div>
        </div>
        <div class="hp-row">
          <div class="hp-name">太郎</div>
          <div class="hp-bar-outer"><div class="hp-bar-inner taro" id="taroHpBar" style="width:100%;"></div></div>
          <div class="hp-num" id="taroHpNum">100/100</div>
        </div>
      </div>
      <div>
        <div class="boss-menu" id="bossMenu" style="display:none;">▶ たたかう&nbsp;&nbsp;にげる&nbsp;&nbsp;どうぐ</div>
        <div class="boss-textbox"><p id="bossText"></p></div>
      </div>
    </div>
  </div>
</div>

<script>
const SIZE = 8;
const CENTER = {x:3, y:3};
const TURN_LIMIT = 15;
const ESCAPE_WINDOW = 3;

const DOORS = {
  up:    {x:3, y:0},
  down:  {x:3, y:6},
  left:  {x:0, y:3},
  right: {x:6, y:3},
};

const HEAVY_TILES = [
  {x:2,y:3}, {x:4,y:3}, {x:3,y:2}, {x:3,y:4}
];

function terrainAt(x,y){
  return y <= 3 ? "flooring" : "tatami";
}
function isDoor(x,y){
  return Object.entries(DOORS).find(([k,p]) => p.x===x && p.y===y);
}
function isHeavy(x,y){
  return HEAVY_TILES.some(p => p.x===x && p.y===y);
}

function key(x,y){ return x+","+y; }

function initGame(){
  const doorKeys = Object.keys(DOORS);
  const trueDoor = doorKeys[Math.floor(Math.random()*doorKeys.length)];

  state = {
    player: {...CENTER},
    turnsUsed: 0,
    fatigueTurns: 0,
    trueDoor: trueDoor,
    openedDoors: new Set(),
    enemies: Object.fromEntries(Object.keys(ENEMY_DEFS).map(k => [k, {
      active: k === "father",
      aggro: false,
      pos: {...ENEMY_DEFS[k].startPos},
      patrolIndex: 0,
      patrolDir: 1,
      stunTurns: 0,
    }])),
    encountered: new Set(["father"]),
    gameOver: false,
  };
  document.getElementById("overlay").style.display = "none";
  const bossOverlay = document.getElementById("bossOverlay");
  bossOverlay.innerHTML = BOSS_OVERLAY_TEMPLATE;
  bossOverlay.style.backgroundImage = "";
  bossOverlay.style.display = "none";
  bossOverlay.classList.remove("shake");
  document.getElementById("msg").textContent = "隣接マスをタップして移動。4つの扉のうち本物は1つだけ。";
  render();
}

function isAdjacent(a,b){ const dx=Math.abs(a.x-b.x), dy=Math.abs(a.y-b.y); return (dx+dy)===1; }

function render(){
  const board = document.getElementById("board");
  board.innerHTML = "";

  const dangerCells = new Set();
  Object.entries(state.enemies).forEach(([k,e]) => {
    if(!e.active) return;
    const def = ENEMY_DEFS[k];
    const r = def.fixedRadius || (state.fatigueTurns > 0 ? 2 : 1);
    for(let dx=-r; dx<=r; dx++){
      for(let dy=-r; dy<=r; dy++){
        if(Math.max(Math.abs(dx),Math.abs(dy)) <= r){
          dangerCells.add(key(e.pos.x+dx, e.pos.y+dy));
        }
      }
    }
  });

  for(let y=0;y<SIZE;y++){
    for(let x=0;x<SIZE;x++){
      const cell = document.createElement("div");
      const terrain = terrainAt(x,y);
      cell.className = "cell terrain-" + terrain;
      if(dangerCells.has(key(x,y))) cell.classList.add("danger");

      const isPlayer = state.player.x===x && state.player.y===y;
      const movable = !state.gameOver && !isPlayer && isAdjacent(state.player,{x,y});
      if(movable){
        cell.classList.add("movable");
        cell.onclick = () => tryMove(x,y);
      }

      const enemyHere = Object.entries(state.enemies).find(([k,e]) => e.active && e.pos.x===x && e.pos.y===y);
      const doorEntry = isDoor(x,y);
      const heavyHere = isHeavy(x,y);

      let content = "";
      let label = "";
      if(isPlayer){
        content = "🚶";
      } else if(enemyHere){
        const eKey = enemyHere[0];
        const eState = state.enemies[eKey];
        content = ENEMY_DEFS[eKey].icon;
        label = eState.stunTurns > 0 ? ENEMY_DEFS[eKey].name + "(夢中)" : ENEMY_DEFS[eKey].name;
      } else if(doorEntry){
        content = state.openedDoors.has(doorEntry[0]) ? "🚪💨" : "🚪";
        label = state.openedDoors.has(doorEntry[0]) ? "物置" : "扉";
      } else if(heavyHere){
        content = "🪑";
        label = "重い家具";
      } else if(x===TV_POS.x && y===TV_POS.y){
        content = "📺";
        label = "テレビ";
      } else if(x===CENTER.x && y===CENTER.y){
        content = "";
      }
      cell.textContent = content;

      if(enemyHere && state.enemies[enemyHere[0]].aggro){
        const alert = document.createElement("div");
        alert.className = "alert";
        alert.textContent = "❗";
        cell.appendChild(alert);
      }

      if(!isPlayer && label){
        const tag = document.createElement("div");
        tag.className = "tag";
        tag.textContent = label;
        cell.appendChild(tag);
      }

      board.appendChild(cell);
    }
  }

  const remaining = TURN_LIMIT - state.turnsUsed;
  const td = document.getElementById("turnsDisplay");
  td.textContent = "経過 " + state.turnsUsed + "T / 残り " + Math.max(remaining,0) + "T";
  td.classList.toggle("low", remaining <= 3);

  const fb = document.getElementById("fatigueBadge");
  fb.classList.toggle("active", state.fatigueTurns > 0);
  fb.textContent = "💫 見つかりやすい(残り" + state.fatigueTurns + ")";

  const encList = [...state.encountered].filter(k => k!=="father").map(k => ENEMY_DEFS[k].name);
  document.getElementById("encounterBadge").textContent = "遭遇: " + (encList.length ? encList.join("・") : "お父さんのみ");
}

function chebyshev(a,b){ return Math.max(Math.abs(a.x-b.x), Math.abs(a.y-b.y)); }

function stepToward(pos, target){
  const dx = target.x - pos.x, dy = target.y - pos.y;
  let nx = pos.x, ny = pos.y;
  if(Math.abs(dx) >= Math.abs(dy) && dx !== 0){
    nx += dx > 0 ? 1 : -1;
  } else if(dy !== 0){
    ny += dy > 0 ? 1 : -1;
  }
  nx = Math.max(0, Math.min(SIZE-1, nx));
  ny = Math.max(0, Math.min(SIZE-1, ny));
  return {x:nx, y:ny};
}

function advancePatrol(e, def){
  let next = e.patrolIndex + e.patrolDir;
  if(next < 0 || next >= def.patrol.length){
    e.patrolDir *= -1;
    next = e.patrolIndex + e.patrolDir;
  }
  e.patrolIndex = next;
  e.pos = {...def.patrol[e.patrolIndex]};
}

function tryMove(x,y){
  if(state.gameOver) return;

  state.player = {x,y};
  state.turnsUsed += 1;

  let flash = "";

  // 重い家具
  if(isHeavy(x,y)){
    state.fatigueTurns = 3;
    flash = "🪑 家具にぶつかって体勢を崩した…しばらく見つかりやすくなる。";
  }

  // 扉判定
  const doorEntry = isDoor(x,y);
  if(doorEntry && !state.openedDoors.has(doorEntry[0])){
    if(doorEntry[0] === state.trueDoor){
      state.gameOver = true;
      render();
      showEscapeResult();
      return;
    } else {
      state.openedDoors.add(doorEntry[0]);
      state.turnsUsed += 1;
      flash = "🚪 ハズレ…そこは物置だった。(+1T)";
    }
  }

  // 増援スポーン
  Object.entries(ENEMY_DEFS).forEach(([k, def]) => {
    if(!state.enemies[k].active && def.spawnTurn > 0 && state.turnsUsed >= def.spawnTurn){
      state.enemies[k].active = true;
      state.encountered.add(k);
      flash = def.icon + " " + def.name + "が出現した…！";
    }
  });

  // 索敵→追跡判定
  Object.entries(state.enemies).forEach(([k,e]) => {
    if(!e.active || e.aggro) return;
    const def = ENEMY_DEFS[k];
    const r = def.fixedRadius || (state.fatigueTurns > 0 ? 2 : 1);
    if(chebyshev(state.player, e.pos) <= r){
      e.aggro = true;
      flash = ENEMY_DEFS[k].name + "に気づかれた！追跡が始まる！";
    }
  });

  // 敵の移動
  let caught = false;
  let caughtBy = null;
  Object.entries(state.enemies).forEach(([k,e]) => {
    if(!e.active || caught) return;
    const def = ENEMY_DEFS[k];

    if(e.stunTurns > 0){
      e.stunTurns -= 1;
      if(e.stunTurns === 0) e.aggro = false;
      return;
    }

    let target = state.player;
    if(e.aggro && def.distractible){
      const r = def.fixedRadius || 1;
      if(chebyshev(e.pos, TV_POS) <= r){
        target = TV_POS;
        flash = ENEMY_DEFS[k].name + "「彼氏も気になるけど……やっぱりテレビのが大事！」";
      }
    }

    const terrain = terrainAt(e.pos.x, e.pos.y);
    const steps = (e.aggro && def.aggroSpeed) ? def.aggroSpeed() : def.speed(terrain);
    for(let i=0; i<steps; i++){
      if(e.aggro){
        e.pos = stepToward(e.pos, target);
      } else {
        advancePatrol(e, def);
      }
      if(target === TV_POS && e.pos.x === TV_POS.x && e.pos.y === TV_POS.y){
        e.stunTurns = 2;
        flash = ENEMY_DEFS[k].name + "「彼氏も気になるけど……やっぱりテレビのが大事！」(2ターン夢中)";
        break;
      }
      if(e.pos.x === state.player.x && e.pos.y === state.player.y){
        if(k === "father" && fatherBattleCount >= 10){
          flash = "お父さん「おう。」";
        } else {
          caught = true;
          caughtBy = k;
          break;
        }
      }
    }
  });

  if(state.fatigueTurns > 0) state.fatigueTurns -= 1;

  document.getElementById("msg").textContent = flash || "…特に何もない部屋だ。";
  render();

  if(caught){
    state.gameOver = true;
    render();
    if(caughtBy === "father"){
      startBossBattle();
    } else {
      showCaughtResult(caughtBy);
    }
    return;
  }
  if(state.turnsUsed >= TURN_LIMIT){
    state.gameOver = true;
    render();
    showTimeoutResult();
  }
}

function calcTitle(){
  const enc = state.encountered;
  const hasM = enc.has("mother"), hasB = enc.has("brother"), hasD = enc.has("dog");
  if(hasM && hasB && hasD) return "修羅場コレクター";
  if(hasM && hasB) return "実家がバレた新入社員";
  if(hasM) return "実家への新年の挨拶";
  if(hasB) return "ゲームの貸し借りをする仲";
  return "模範的サラリーマン";
}

function showEscapeResult(){
  const overlay = document.getElementById("overlay");
  overlay.style.display = "flex";
  if(state.turnsUsed <= ESCAPE_WINDOW){
    overlay.innerHTML = `
      <div class="quiet">……そっと玄関を出た。</div>
      <div class="btnrow" style="margin-top:20px;">
        <button class="good" onclick="initGame()">🔁 もう一度</button>
      </div>
    `;
  } else {
    overlay.innerHTML = `
      <div class="big">🚪</div>
      <h2>命からがら脱出</h2>
      <p>${state.turnsUsed}ターンかけて、なんとか本物の扉から逃げ切った。</p>
      <div class="title-badge">称号：${calcTitle()}</div>
      <div class="btnrow">
        <button class="good" onclick="initGame()">🔁 もう一度</button>
      </div>
    `;
  }
}

function wait(ms){ return new Promise(res => setTimeout(res, ms)); }

async function startBossBattle(){
  fatherBattleCount += 1;
  const count = fatherBattleCount;

  const bossOverlay = document.getElementById("bossOverlay");
  const bossText = document.getElementById("bossText");
  const bossMenu = document.getElementById("bossMenu");
  const bossFlash = document.getElementById("bossFlash");
  const taroBar = document.getElementById("taroHpBar");
  const taroNum = document.getElementById("taroHpNum");

  bossOverlay.style.backgroundImage = `linear-gradient(rgba(10,5,5,0.15), rgba(10,5,5,0.55)), url('${FATHER_IMG}')`;
  bossOverlay.style.display = "flex";
  bossMenu.style.display = "none";
  taroBar.style.width = "100%";
  taroNum.textContent = "100/100";
  bossText.textContent = "";

  await wait(300);
  bossText.textContent = "お父さんが あらわれた！";
  await wait(1200);

  bossMenu.style.display = "flex";
  await wait(500);
  bossMenu.style.display = "none";

  bossText.textContent = "お父さんの せんせいこうげき！";
  await wait(800);

  bossText.textContent = "お父さんの 『親父の鉄拳』！";
  bossOverlay.classList.add("shake");
  bossFlash.classList.add("on");
  await wait(120);
  bossFlash.classList.remove("on");
  bossFlash.classList.add("off");
  taroBar.style.width = "0%";
  taroNum.textContent = "0/100";
  await wait(900);
  bossOverlay.classList.remove("shake");
  bossFlash.classList.remove("off");

  bossText.textContent = "太郎に 9999999 のダメージ！";
  await wait(1500);

  bossText.textContent = "太郎は たおれた……";
  await wait(1000);

  if(count === 10){
    await wait(600);
    bossText.textContent = "……何度も来るな、お前は。";
    await wait(2200);
    bossText.textContent = "……娘をよろしく頼む。";
    await wait(2400);
    bossOverlay.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; background:rgba(6,10,28,0.97);">
        <div style="font-size:15px; letter-spacing:3px; color:var(--gold); margin-bottom:10px;">🏆 TRUE END</div>
        <div style="font-size:20px; color:#fff; letter-spacing:2px; margin-bottom:20px;">認められた男</div>
        <button class="good" onclick="initGame()">🔁 もう一度</button>
      </div>
    `;
  } else {
    bossOverlay.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; background:rgba(6,10,28,0.9); padding:16px; text-align:center;">
        <div class="title-badge">称号：${calcTitle()}</div>
        <div style="font-size:9px; color:#9aa4cf; margin-bottom:14px;">お父さん撃破(?)回数：${count}回目</div>
        <button class="primary" onclick="initGame()">🔁 リベンジする</button>
      </div>
    `;
  }
}

function showCaughtResult(caughtBy){
  const overlay = document.getElementById("overlay");
  overlay.style.display = "flex";
  const name = ENEMY_DEFS[caughtBy] ? ENEMY_DEFS[caughtBy].name : "誰か";
  overlay.innerHTML = `
    <p style="margin-top:20px;">${name}に見つかった…。</p>
    <div class="title-badge">称号：${calcTitle()}</div>
    <div class="btnrow" style="margin-top:12px;">
      <button class="primary" onclick="initGame()">🔁 リベンジする</button>
    </div>
  `;
}

function showTimeoutResult(){
  const overlay = document.getElementById("overlay");
  overlay.style.display = "flex";
  overlay.innerHTML = `
    <div class="big">⏰</div>
    <h2>タイムアップ</h2>
    <p>15ターンが経過し、家中が家族と犬で埋め尽くされた…。</p>
    <div class="title-badge">称号：${calcTitle()}</div>
    <div class="btnrow">
      <button class="primary" onclick="initGame()">🔁 リベンジする</button>
    </div>
  `;
}

initGame();
</script>
